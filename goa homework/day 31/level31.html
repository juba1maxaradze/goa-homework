<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>CSS დავალებები</title>
    <link rel="stylesheet" href="./level31.css">
</head>
<body>

    <!-- დავალება 1:
    შექმენით article ტეგი და მიანიჭეთ:
    220px სიგანე,
    ფონის ფერი,
    შიდა დაშორება მხოლოდ ზევით და ქვემოთ,
    1px წყვეტილი საზღვარი (dashed)
    -->
    <article>
        ეს არის article ტეგი
    </article>


    <!-- დავალება 2:
    გააკეთეთ 3 ბლოკი (div)
    პირველ div-ს მხოლოდ padding
    მეორეს მხოლოდ border
    მესამეს მხოლოდ margin
    -->
    <div class="box padding-box">Padding</div>
    <div class="box border-box">Border</div>
    <div class="box margin-box">Margin</div>


    <!-- დავალება 3:
    გვერდზე ჩასვით პატარა მართკუთხა სურათი
    border-radius: 20px
    შემდეგ border-radius: 5px 30px 50px 10px
    -->
    <img class="img-one" src="https://via.placeholder.com/150" alt="image">
    <img class="img-two" src="https://via.placeholder.com/150" alt="image">


    <!-- დავალება 4:
    შექმენით გარე div და 2 შვილი div
    გარე: padding, width, height, background-color
    შვილი: margin, width, height, background-color
    -->
    <div class="parent">
        <div class="child child-one"></div>
        <div class="child child-two"></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>website</title>
</head>
<body>

  <main class="card">
    <header class="card-header">
      <img src="./images/bg-pattern-card.svg" alt="">
    </header>

    <div class="profile-section">
      <img src="./images/image-victor.jpg" alt="Victor Crest" class="profile-img">
      <h1>Victor Crest <span>26</span></h1>
      <p>London</p>
    </div>

    <hr>

    <footer class="stats">
      <div class="stat-item">
        <h2>80K</h2>
        <p>Followers</p>
      </div>
      <div class="stat-item">
        <h2>803K</h2>
        <p>Likes</p>
      </div>
      <div class="stat-item">
        <h2>1.4K</h2>
        <p>Photos</p>
      </div>
    </footer>
  </main>

</body>
</html>

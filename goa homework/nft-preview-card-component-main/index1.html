<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>website</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <main class="card">
    <div class="image-container">
      <img src="./images/image-equilibrium.jpg" alt="Equilibrium NFT" class="main-image">
      <div class="overlay">
        <img src="./images/icon-view.svg" alt="view icon">
      </div>
    </div>

    <section class="content">
      <h1 class="title">Equilibrium #3429</h1>
      <p class="description">Our Equilibrium collection promotes balance and calm.</p>
      
      <div class="stats">
        <div class="eth">
          <img src="./images/icon-ethereum.svg" alt="ETH">
          <span>0.041 ETH</span>
        </div>
        <div class="time">
          <img src="./images/icon-clock.svg" alt="Clock">
          <span>3 days left</span>
        </div>
      </div>
    </section>

    <hr class="divider">

    <footer class="creator">
      <img src="./images/image-avatar.png" alt="Avatar" class="avatar">
      <p>Creation of <a href="#">Jules Wyvern</a></p>
    </footer>
  </main>

</body>
</html>

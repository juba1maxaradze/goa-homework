<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>დავალებები</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1.
    შექმენი ორი ბმული: ერთი რომელიც არ გაქვს ნანახი და ერთი რომელიც გაქვს ნანახი.
    არანანახი ბმული (a:link): ტექსტი იყოს ლურჯი ფერის და გაუსმული ხაზით.
    ნანახი ბმული (a:visited): ტექსტი იყოს ნაცრისფერი და გამუქებული (bold).
    -->
    <a href="https://example.com">არანანახი ბმული</a><br>
    <a href="https://google.com">ნანახი ბმული</a>

    <br><br>

    <!-- 2.
    შექმენი ერთი <button> ელემენტი.
    მაუსის გადატარებისას (:hover):
    ფონის ფერი შეიცვალოს და გაიზარდოს.
    ტექსტის ფერი გახდეს თეთრი.
    დაჭერის მომენტში (:active):
    გაუქრეს ჩარჩო (border: none).
    -->
    <button>დაჭირე</button>

    <br><br>

    <!-- 3.
    შექმენი ერთი <h1> ტეგი და ერთი <p> ტეგი.
    <h1> ტეგს ჰქონდეს ხაზგასმა და იყოს წითელი ფერის.
    <p> ტეგს ჰქონდეს ქვედა ხაზგასმა.
    -->
    <h1>სათაური</h1>
    <p>ეს არის პარაგრაფი</p>

    <br>

    <!-- 4.
    შექმენი ორი ტექსტური ელემენტი (<p> ტეგი).
    პირველი იყენებდეს Times New Roman-ს და serif-ს.
    მეორე იყენებდეს Arial-ს და sans-serif-ს.
    -->
    <p class="serif-text">Times New Roman ტექსტი</p>
    <p class="sans-text">Arial ტექსტი</p>

</body>
</html>

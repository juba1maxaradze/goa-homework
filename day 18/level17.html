<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1) კომენტარის სახით ახსენი რა არის div და რაში გვეხმარება. -->
    <!-- სხვადასხვა თაგების დაჯგუფებაში და მათი ერთად გასტილვაში -->

    <!-- 2) div ში მოათავსეთ 5 პარაგრაფი და ყველას ერთად შეუცვალეთ ტექსტის ფერი, შემდეგ კი ინდივიდუალურად გასტილეთ და შეუცვალეთ ფონები.
 -->
    <div style="color: red">
     <p style="background-color: black;">hello world</p>
     <p style="background-color: blue;">hello world</p>
     <p style="background-color: skyblue;">hello world</p>
     <p style="background-color: yellow;">hello world</p>
     <p style="background-color: green;">hello world</p>
    </div>

    <!--  3) div ში მოათავსეთ 4 h2 შემდეგ თვითონ დივს შეუცვალეთ ფონი დაბგაუწერეთ border, საბოლოოდ კი გასტილეთ ეს h2-ბი და მიანიჭეთ სასურველი: ფერი, ზომა და ადგილმდებარეობა.-->
      <div style="border: blue 1 px solid;">
        <h2 style="font-size: 20px; color: red; text-align: center;">h2</h2>
        <h2 style="font-size: 10px; color: blue; text-align: left;">h2</h2>
        <h2 style="font-size: 15px; color: yellow; text-align: right;">h2</h2>
        <h2 style="font-size: 25px; color: green; text-align: center;">h2</h2>
      </div>


      <!-- 4) შექმენით table  5 row და 6 column ით, პირველ row-ში გამოიყენეთ th-ები, საბოლოოდ ყველა td-საც და table-საც გაუწერეთ border. -->
       <table>
        <tr><th>a</th><th>s</th><th>d</th><th>f</th><th>g</th><th>h</th></tr>
        <tr><td>a</td><td>s</td><td>d</td><td>f</td><td>g</td><td>h</td></tr>
        <tr><td>a</td><td>s</td><td>d</td><td>f</td><td>g</td><td>h</td></tr>
        <tr><td>a</td><td>s</td><td>d</td><td>f</td><td>g</td><td>h</td></tr>
        <tr><td>a</td><td>s</td><td>d</td><td>f</td><td>g</td><td>h</td></tr>
       </table>

    <!-- 5) გააკეთეთ მსგავსი table: -->

    <table style="border: 1px double;">
     <tr><th>person</th><th>age</th></tr>
     <tr><td>chris</td><td>38</td></tr>
     <tr><td>dennis</td><td>45</td></tr>
     <tr><td>sarah</td><td>29</td></tr>
     <tr><td>karen</td><td>47</td></tr>
    </table>
</body>
</html>
